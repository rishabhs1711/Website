  <blockquote>
    <p id="quote-text">Loading quote...</p>
    <footer id="quote-author"></footer>
  </blockquote>
</section>
        </footer>

<script>
  async function loadDailyQuote() {
    const text = document.getElementById("quote-text");
    const author = document.getElementById("quote-author");

    try {
      const response = await fetch("https://quoteslate.vercel.app/api/quotes/random?count=5");
      if (!response.ok) {
        throw new Error(`API request failed:`+response.status);
      }
	
	const data = await response.json();
	// const quotes = data.quotes;
	
	if (!Array.isArray(data) || data.length === 0) {
        throw new Error("No quotes were returned");
      }

      // Count days since January 1, 1970 using UTC.
      const day = Math.floor(Date.now() / 86400000);

      // Choose the same quote throughout that day.
      const quote = data[day % data.length];

      text.textContent = quote.quote;
	author.textContent = `— ` + quote.author;
    }
	catch (error) {
      text.textContent = "The daily quote is unavailable right now.";
      author.textContent = "";
      console.error("Could not load the quote:", error);
    }
  }

  loadDailyQuote();
</script>
